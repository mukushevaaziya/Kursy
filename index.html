<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учебный портал институтов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: шапка с вкладками институтов → слева оглавление курса, справа страница учебника или тест */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #17202C;
  --muted: #5B6676;
  --line: #DCE1E8;
  --soft: #E9EDF3;
  --ok: #1E7D4F;
  --ok-bg: #E3F4EA;
  --bad: #B3261E;
  --bad-bg: #FBE7E5;
  --upr: #2F55D4;
  --dip: #0E7A6B;
  --nsh: #8A3D7A;
  --accent: var(--upr);
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-ui: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-read: "Literata", "PT Serif", Georgia, serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161D; --surface: #18202A; --ink: #E6EAF0; --muted: #9AA5B4; --line: #2A3441; --soft: #212B37;
    --ok: #5CC98E; --ok-bg: #16301F; --bad: #F08A80; --bad-bg: #3A1D1B;
    --upr: #7C9BFF; --dip: #4CC4B1; --nsh: #D58AC4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161D; --surface: #18202A; --ink: #E6EAF0; --muted: #9AA5B4; --line: #2A3441; --soft: #212B37;
  --ok: #5CC98E; --ok-bg: #16301F; --bad: #F08A80; --bad-bg: #3A1D1B;
  --upr: #7C9BFF; --dip: #4CC4B1; --nsh: #D58AC4; color-scheme: dark;
}
[data-inst="upr"] { --accent: var(--upr); }
[data-inst="dip"] { --accent: var(--dip); }
[data-inst="nsh"] { --accent: var(--nsh); }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Шапка */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 14px 20px 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 32px; }
.brand { display: flex; align-items: baseline; gap: 10px; padding-bottom: 12px; }
.brand b { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
.tab { border: 0; background: none; cursor: pointer; padding: 10px 14px 12px; border-bottom: 3px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 8px; color: var(--muted); font-weight: 500; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .pct { font-size: 12px; font-variant-numeric: tabular-nums; padding: 1px 7px; border-radius: 99px; background: var(--soft); color: var(--muted); }
.tab[aria-selected="true"] .pct { background: var(--accent); color: var(--surface); }

/* Основная сетка */
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 64px; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); max-height: calc(100vh - 100px); overflow: auto; }
.inst-head { padding: 4px 4px 16px; }
.inst-head .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.inst-head h2 { font-family: var(--f-display); font-weight: 500; font-size: 18px; margin: 4px 0 6px; text-wrap: balance; line-height: 1.25; }
.inst-head p { margin: 0; color: var(--muted); font-size: 13px; }
.bar { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }

.topic { border-top: 1px solid var(--line); padding: 12px 0; }
.topic-btn { width: 100%; text-align: left; border: 0; background: none; cursor: pointer; padding: 4px; display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: start; }
.topic-num { font-family: var(--f-display); font-size: 12px; color: var(--accent); padding-top: 2px; }
.topic-title { font-weight: 600; line-height: 1.3; }
.topic-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.items { list-style: none; margin: 6px 0 0; padding: 0 0 0 30px; display: grid; gap: 2px; }
.item { width: 100%; border: 0; background: none; cursor: pointer; text-align: left; display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; font-size: 14px; color: var(--muted); }
.item:hover { background: var(--soft); color: var(--ink); }
.item[aria-current="true"] { background: var(--soft); color: var(--ink); font-weight: 500; box-shadow: inset 3px 0 0 var(--accent); }
.mark { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; }
.mark.done { background: var(--ok); border-color: var(--ok); }
.mark.done::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--surface); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.mark.test { border-radius: 4px; }
.score { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; padding: 0 6px; border-radius: 6px; }
.score.pass { background: var(--ok-bg); color: var(--ok); }
.score.fail { background: var(--bad-bg); color: var(--bad); }

.nav-toggle { display: none; }

/* Страница учебника */
.paper { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 36px 48px 28px; min-width: 0; }
.crumbs { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; }
.crumbs b { color: var(--accent); font-weight: 600; }
.paper h1 { font-family: var(--f-display); font-weight: 500; font-size: clamp(22px, 3vw, 30px); line-height: 1.2; margin: 10px 0 20px; text-wrap: balance; max-width: 30ch; }
.text { font-family: var(--f-read); font-size: 17px; line-height: 1.7; max-width: 66ch; }
.text p { margin: 0 0 1em; }
.text h3 { font-family: var(--f-ui); font-size: 16px; font-weight: 600; margin: 1.6em 0 .5em; }
.text ul, .text ol { padding-left: 1.3em; margin: 0 0 1em; }
.text li { margin-bottom: .35em; }
.text .term { font-family: var(--f-ui); font-size: 14px; line-height: 1.55; background: var(--soft); border-radius: 8px; padding: 14px 18px; margin: 1.4em 0; }
.text .term b { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.text table { border-collapse: collapse; font-family: var(--f-ui); font-size: 14px; width: 100%; margin: 0 0 1em; }
.text td, .text th { border-bottom: 1px solid var(--line); padding: 8px 10px 8px 0; text-align: left; vertical-align: top; }
.tbl { overflow-x: auto; }

.foot { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.done-toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; border: 1.5px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 99px; font-weight: 500; }
.done-toggle:hover { border-color: var(--ok); }
.done-toggle.on { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.done-toggle .mark { border-color: currentColor; }
.pager { display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--soft); }
.btn:disabled { opacity: .4; cursor: default; background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }

/* Тест */
.intro { color: var(--muted); margin: -8px 0 24px; }
.q { border-top: 1px solid var(--line); padding: 20px 0; }
.q-title { font-weight: 600; margin: 0 0 12px; display: flex; gap: 10px; }
.q-title span { color: var(--accent); font-family: var(--f-display); font-size: 13px; padding-top: 2px; font-weight: 500; }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt input { margin: 3px 0 0; accent-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt .tag { margin-left: auto; font-size: 12px; font-weight: 600; white-space: nowrap; }
.opt.right .tag { color: var(--ok); }
.opt.wrong .tag { color: var(--bad); }
.checked .opt { cursor: default; }
.checked .opt:not(.right):not(.wrong):hover { border-color: var(--line); }
.explain { margin-top: 10px; font-size: 14px; color: var(--muted); padding-left: 14px; border-left: 2px solid var(--line); }
.result { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 18px 20px; border-radius: var(--r); margin-bottom: 8px; }
.result.pass { background: var(--ok-bg); color: var(--ok); }
.result.fail { background: var(--bad-bg); color: var(--bad); }
.result .big { font-family: var(--f-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.result p { margin: 0; color: var(--ink); max-width: 46ch; }
.hint { font-size: 13px; color: var(--muted); }

@media (max-width: 860px) {
  .wrap { grid-template-columns: 1fr; padding-inline: 16px; gap: 16px; }
  .top-in { padding-inline: 16px; }
  .tabs { margin-left: 0; width: 100%; }
  .side { position: static; max-height: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 4px; }
  .nav-toggle { display: inline-flex; margin-bottom: 12px; }
  .side.closed .topics { display: none; }
  .paper { padding: 24px 20px 20px; }
  .text { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><b>Учебный портал</b><span>курсы институтов</span></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Институты"></nav>
  </div>
</header>

<div class="wrap" id="app">
  <aside class="side" id="side"></aside>
  <main class="paper" id="main"></main>
</div>

<script>
/* ===== Содержание курсов. Чтобы добавить институт, допишите объект в массив INSTITUTES. ===== */
const INSTITUTES = [
{
  id: "upr", name: "Институт управления", short: "Управление",
  about: "Основы менеджмента, стратегия и управление проектами.",
  topics: [
  {
    title: "Основы менеджмента",
    pages: [
      { title: "Что такое управление", html: `
<p>Управление (менеджмент) — это целенаправленное воздействие на людей и ресурсы организации ради достижения её целей. Руководитель не выполняет всю работу сам: он создаёт условия, в которых работа выполняется другими людьми.</p>
<p>Классики менеджмента М. Мескон, М. Альберт и Ф. Хедоури выделяют четыре основные функции управления. Они повторяются циклически: результаты контроля становятся исходными данными для нового планирования.</p>
<ol>
<li><b>Планирование</b> — определение целей и путей их достижения.</li>
<li><b>Организация</b> — распределение задач, полномочий и ресурсов.</li>
<li><b>Мотивация</b> — побуждение людей действовать ради общих целей.</li>
<li><b>Контроль</b> — сравнение фактических результатов с плановыми и корректировка.</li>
</ol>
<div class="term"><b>Ключевой термин</b>Организация в менеджменте — это группа людей, деятельность которых сознательно координируется для достижения общей цели.</div>
<p>Анри Файоль, один из основателей административной школы, ещё в начале XX века описал похожий набор: предвидение, организацию, распорядительство, координацию и контроль. Современные функции во многом выросли из его модели.</p>` },
      { title: "Уровни управления и роли руководителя", html: `
<p>В любой крупной организации выделяют три уровня управления. Чем выше уровень, тем больше времени руководитель тратит на стратегические вопросы и тем меньше — на текущие операции.</p>
<div class="tbl"><table>
<tr><th>Уровень</th><th>Кто это</th><th>Главная задача</th></tr>
<tr><td>Высший</td><td>Генеральный директор, правление</td><td>Стратегия и развитие организации</td></tr>
<tr><td>Средний</td><td>Руководители отделов и филиалов</td><td>Перевод стратегии в конкретные планы</td></tr>
<tr><td>Низовой</td><td>Мастера, руководители групп</td><td>Организация повседневной работы исполнителей</td></tr>
</table></div>
<p>Генри Минцберг, изучая реальный рабочий день руководителей, выделил десять ролей, объединённых в три группы:</p>
<ul>
<li><b>Межличностные</b>: главный руководитель, лидер, связующее звено.</li>
<li><b>Информационные</b>: приёмник информации, распространитель, представитель.</li>
<li><b>Роли по принятию решений</b>: предприниматель, устраняющий нарушения, распределитель ресурсов, ведущий переговоры.</li>
</ul>
<p>Хороший руководитель переключается между ролями в течение дня: утром ведёт переговоры с поставщиком, днём решает конфликт в команде, вечером распределяет бюджет.</p>` },
      { title: "Принятие управленческих решений", html: `
<p>Управленческое решение — это выбор одной альтернативы из нескольких возможных. Решения бывают <b>запрограммированными</b> (повторяющиеся ситуации с понятным порядком действий) и <b>незапрограммированными</b> (новые, нестандартные ситуации).</p>
<h3>Рациональный процесс принятия решения</h3>
<ol>
<li>Диагностика проблемы.</li>
<li>Формулировка ограничений и критериев выбора.</li>
<li>Поиск альтернатив.</li>
<li>Оценка альтернатив.</li>
<li>Выбор лучшей альтернативы.</li>
<li>Реализация решения и обратная связь.</li>
</ol>
<p>На практике руководитель редко располагает полной информацией. Герберт Саймон назвал это <i>ограниченной рациональностью</i>: человек выбирает не оптимальный, а первый удовлетворительный вариант.</p>
<div class="term"><b>Совет</b>Перед важным решением запишите критерии выбора заранее. Это защищает от соблазна подогнать критерии под понравившийся вариант.</div>` }
    ],
    test: [
      { q: "Какая функция управления заключается в сравнении фактических результатов с плановыми?", a: ["Планирование", "Мотивация", "Контроль", "Организация"], c: 2, e: "Контроль замыкает управленческий цикл и даёт данные для нового планирования." },
      { q: "Кто выделил десять управленческих ролей руководителя?", a: ["Анри Файоль", "Генри Минцберг", "Фредерик Тейлор", "Питер Друкер"], c: 1, e: "Минцберг описал 10 ролей в трёх группах: межличностные, информационные и роли по принятию решений." },
      { q: "Какой уровень управления отвечает за перевод стратегии в конкретные планы?", a: ["Высший", "Средний", "Низовой"], c: 1, e: "Руководители среднего звена связывают стратегию с повседневной работой." },
      { q: "Как называется ситуация, когда человек выбирает первый удовлетворительный вариант, а не оптимальный?", a: ["Ограниченная рациональность", "Делегирование", "Программирование решения", "Синергия"], c: 0, e: "Термин Герберта Саймона." }
    ]
  },
  {
    title: "Стратегическое планирование",
    pages: [
      { title: "Миссия, видение и цели", html: `
<p>Стратегическое планирование начинается с ответа на три вопроса: зачем существует организация, какой она хочет стать и каких результатов добивается.</p>
<ul>
<li><b>Миссия</b> — смысл существования организации, её предназначение для общества и клиентов.</li>
<li><b>Видение</b> — образ желаемого будущего организации через 5–10 лет.</li>
<li><b>Цели</b> — конкретные измеримые результаты, которые приближают организацию к видению.</li>
</ul>
<h3>Правило SMART</h3>
<p>Хорошо сформулированная цель отвечает пяти критериям:</p>
<div class="tbl"><table>
<tr><td><b>S</b> — Specific</td><td>конкретная</td></tr>
<tr><td><b>M</b> — Measurable</td><td>измеримая</td></tr>
<tr><td><b>A</b> — Achievable</td><td>достижимая</td></tr>
<tr><td><b>R</b> — Relevant</td><td>значимая, связанная с общими целями</td></tr>
<tr><td><b>T</b> — Time-bound</td><td>ограниченная во времени</td></tr>
</table></div>
<div class="term"><b>Пример</b>Плохо: «Улучшить обслуживание клиентов». Хорошо: «Сократить среднее время ответа на обращение с 48 до 24 часов к 1 июня».</div>` },
      { title: "SWOT- и PEST-анализ", html: `
<p>Прежде чем выбирать стратегию, организация изучает свою внутреннюю и внешнюю среду. Два самых распространённых инструмента для этого — SWOT и PEST.</p>
<h3>SWOT-анализ</h3>
<p>Матрица из четырёх квадрантов. Сильные и слабые стороны относятся к внутренней среде, возможности и угрозы — к внешней.</p>
<div class="tbl"><table>
<tr><th></th><th>Положительное</th><th>Отрицательное</th></tr>
<tr><td><b>Внутренняя среда</b></td><td>Strengths — сильные стороны</td><td>Weaknesses — слабые стороны</td></tr>
<tr><td><b>Внешняя среда</b></td><td>Opportunities — возможности</td><td>Threats — угрозы</td></tr>
</table></div>
<h3>PEST-анализ</h3>
<p>Помогает систематически изучить внешнюю среду по четырём группам факторов:</p>
<ul>
<li><b>P</b>olitical — политические: законы, регулирование, налоги.</li>
<li><b>E</b>conomic — экономические: инфляция, курсы валют, доходы населения.</li>
<li><b>S</b>ocial — социальные: демография, ценности, образ жизни.</li>
<li><b>T</b>echnological — технологические: новые технологии и их распространение.</li>
</ul>
<p>Результаты PEST-анализа часто становятся источником для квадрантов «возможности» и «угрозы» в SWOT.</p>` }

<p>Проект — это временное предприятие, направленное на создание уникального продукта, услуги или результата. У проекта всегда есть начало и конец, и этим он отличается от операционной деятельности, которая повторяется постоянно.</p>
<h3>Фазы жизненного цикла</h3>

<li><b>Исполнение</b> — выполнение работ командой.</li>

<p>Государственная политика — это система целей, решений и действий органов власти, направленных на решение общественно значимых проблем. Она проявляется в законах, программах, бюджетах и конкретных мерах.</p>
<p>Близкое понятие — <b>публичная политика</b>. Оно подчёркивает, что в выработке решений участвует не только государство, но и бизнес, некоммерческие организации, эксперты и граждане.</p>
<h3>Уровни политики</h3>

/* ===== Хранилище прогресса (только в этом браузере) ===== */
const store = {
  get(k, d) { try { const v = localStorage.getItem("kp_" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("kp_" + k, JSON.stringify(v)); } catch (e) {} }
};
let done = store.get("done", {});
let tests = store.get("tests", {});
let state = store.get("state", { inst: "upr", topic: 0, view: 0 });
if (!INSTITUTES.find(i => i.id === state.inst)) state = { inst: INSTITUTES[0].id, topic: 0, view: 0 };
let answers = {};   // ответы текущего теста
let checked = false;
let navClosed = false;

const $ = s => document.querySelector(s);
const inst = () => INSTITUTES.find(i => i.id === state.inst);
const pKey = (i, t, p) => `${i}/${t}/${p}`;
const tKey = (i, t) => `${i}/${t}`;
const PASS = 0.75;

function instProgress(I) {
  let total = 0, n = 0;
  I.topics.forEach((T, t) => {
    T.pages.forEach((_, p) => { total++; if (done[pKey(I.id, t, p)]) n++; });
    total++; const r = tests[tKey(I.id, t)]; if (r && r.best / r.total >= PASS) n++;
  });
  return { n, total, pct: Math.round(n / total * 100) };
}
function topicProgress(I, t) {
  const T = I.topics[t]; let n = 0;
  T.pages.forEach((_, p) => { if (done[pKey(I.id, t, p)]) n++; });
  const r = tests[tKey(I.id, t)]; if (r && r.best / r.total >= PASS) n++;
  return { n, total: T.pages.length + 1 };
}

function go(patch) {
  Object.assign(state, patch);
  answers = {}; checked = false;
  store.set("state", state);
  if (window.innerWidth <= 860) navClosed = true;
  render();
  window.scrollTo({ top: 0 });
}

function renderTabs() {
  $("#tabs").innerHTML = INSTITUTES.map(I => `
    <button class="tab" role="tab" data-inst="${I.id}" aria-selected="${I.id === state.inst}" data-go="${I.id}">
      ${I.name}<span class="pct">${instProgress(I).pct}%</span>
    </button>`).join("");
  $("#tabs").querySelectorAll("[data-go]").forEach(b => b.onclick = () => go({ inst: b.dataset.go, topic: 0, view: 0 }));
}

function renderSide() {
  const I = inst(), pr = instProgress(I);
  $("#side").className = "side" + (navClosed ? " closed" : "");
  $("#side").innerHTML = `
    <div class="inst-head">
      <div class="eyebrow">${I.short}</div>
      <h2>${I.name}</h2>
      <p>${I.about}</p>
      <div class="bar" aria-hidden="true"><i style="width:${pr.pct}%"></i></div>
      <p style="margin-top:6px">Пройдено ${pr.n} из ${pr.total} шагов</p>
    </div>
    <button class="btn nav-toggle" id="navToggle">${navClosed ? "Показать темы" : "Скрыть темы"}</button>
    <div class="topics">
    ${I.topics.map((T, t) => {
      const tp = topicProgress(I, t), r = tests[tKey(I.id, t)];
      const sc = r ? `<span class="score ${r.best / r.total >= PASS ? "pass" : "fail"}">${r.best}/${r.total}</span>` : "";
      return `<div class="topic">
        <button class="topic-btn" data-t="${t}" data-v="0">
          <span class="topic-num">${String(t + 1).padStart(2, "0")}</span>
          <span class="topic-title">${T.title}</span>
          <span class="topic-count">${tp.n}/${tp.total}</span>
        </button>
        <ul class="items">
          ${T.pages.map((P, p) => `<li><button class="item" data-t="${t}" data-v="${p}" aria-current="${state.topic === t && state.view === p}">
            <span class="mark ${done[pKey(I.id, t, p)] ? "done" : ""}"></span>${P.title}</button></li>`).join("")}
          <li><button class="item" data-t="${t}" data-v="test" aria-current="${state.topic === t && state.view === "test"}">
            <span class="mark test ${r && r.best / r.total >= PASS ? "done" : ""}"></span>Тест по теме${sc}</button></li>
        </ul>
      </div>`;
    }).join("")}
    </div>`;
  $("#side").querySelectorAll("[data-t]").forEach(b => b.onclick = () => go({ topic: +b.dataset.t, view: b.dataset.v === "test" ? "test" : +b.dataset.v }));
  $("#navToggle").onclick = () => { navClosed = !navClosed; renderSide(); };
}

function renderPage() {
  const I = inst(), T = I.topics[state.topic], p = state.view, P = T.pages[p];
  const k = pKey(I.id, state.topic, p), isDone = !!done[k];
  $("#main").innerHTML = `
    <div class="crumbs"><b>${I.name}</b><span>Тема ${state.topic + 1}. ${T.title}</span><span>· Страница ${p + 1} из ${T.pages.length}</span></div>
    <h1>${P.title}</h1>
    <div class="text">${P.html}</div>
    <div class="foot">
      <button class="done-toggle ${isDone ? "on" : ""}" id="doneBtn" aria-pressed="${isDone}">
        <span class="mark ${isDone ? "done" : ""}"></span>${isDone ? "Пройдено" : "Отметить как пройдено"}
      </button>
      <div class="pager">
        <button class="btn" id="prev" ${p === 0 ? "disabled" : ""}>Назад</button>
        <button class="btn primary" id="next">${p < T.pages.length - 1 ? "Далее" : "К тесту"}</button>
      </div>
    </div>`;
  $("#doneBtn").onclick = () => {
    if (done[k]) delete done[k]; else done[k] = true;
    store.set("done", done); render();
  };
  $("#prev").onclick = () => go({ view: p - 1 });
  $("#next").onclick = () => {
    if (!done[k]) { done[k] = true; store.set("done", done); }
    go({ view: p < T.pages.length - 1 ? p + 1 : "test" });
  };
}

function renderTest() {
  const I = inst(), T = I.topics[state.topic], Q = T.test, k = tKey(I.id, state.topic), r = tests[k];
  let score = 0;
  if (checked) Q.forEach((q, i) => { if (answers[i] === q.c) score++; });
  const pass = score / Q.length >= PASS;
  const answeredAll = Object.keys(answers).length === Q.length;
  $("#main").innerHTML = `
    <div class="crumbs"><b>${I.name}</b><span>Тема ${state.topic + 1}. ${T.title}</span><span>· Тест</span></div>
    <h1>Тест: ${T.title}</h1>
    <p class="intro">${Q.length} вопроса. Для зачёта нужно ответить правильно минимум на ${Math.ceil(Q.length * PASS)}.${r ? ` Лучший результат: ${r.best} из ${r.total}.` : ""}</p>
    ${checked ? `<div class="result ${pass ? "pass" : "fail"}">
      <span class="big">${score} / ${Q.length}</span>
      <p>${pass ? "Тест пройден. Правильные ответы отмечены зелёным." : "Тест не пройден. Посмотрите, где ошибка, перечитайте страницы темы и попробуйте ещё раз."}</p>
    </div>` : ""}
    <div class="${checked ? "checked" : ""}">
    ${Q.map((q, i) => `<div class="q">
      <p class="q-title"><span>${i + 1}</span>${q.q}</p>
      <div class="opts">${q.a.map((a, j) => {
        let cls = "", tag = "";
        if (checked) {
          if (j === q.c) { cls = "right"; tag = answers[i] === j ? "Верно" : "Правильный ответ"; }
          else if (answers[i] === j) { cls = "wrong"; tag = "Неверно"; }
        }
        return `<label class="opt ${cls}">
          <input type="radio" id="q${i}a${j}" name="q${i}" value="${j}" ${answers[i] === j ? "checked" : ""} ${checked ? "disabled" : ""}>
          <span>${a}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</label>`;
      }).join("")}</div>
      ${checked ? `<div class="explain">${q.e}</div>` : ""}
    </div>`).join("")}
    </div>
    <div class="foot">
      <span class="hint">${checked ? "" : answeredAll ? "Все вопросы отвечены." : `Отвечено ${Object.keys(answers).length} из ${Q.length}.`}</span>
      <div class="pager">
        ${checked
          ? `<button class="btn" id="retry">Пройти заново</button>${state.topic < I.topics.length - 1 ? `<button class="btn primary" id="nextTopic">Следующая тема</button>` : ""}`
          : `<button class="btn primary" id="check" ${answeredAll ? "" : "disabled"}>Проверить ответы</button>`}
      </div>
    </div>`;
  $("#main").querySelectorAll("input[type=radio]").forEach(inp => inp.onchange = () => {
    answers[+inp.name.slice(1)] = +inp.value; renderTest();
  });
  const c = $("#check");
  if (c) c.onclick = () => {
    checked = true;
    let s = 0; Q.forEach((q, i) => { if (answers[i] === q.c) s++; });
    const prev = tests[k];
    tests[k] = { best: Math.max(s, prev ? prev.best : 0), last: s, total: Q.length };
    store.set("tests", tests);
    render(); window.scrollTo({ top: 0 });
  };
  const rt = $("#retry"); if (rt) rt.onclick = () => go({});
  const nt = $("#nextTopic"); if (nt) nt.onclick = () => go({ topic: state.topic + 1, view: 0 });
}

function render() {
  document.documentElement.dataset.inst = state.inst;
  document.body.dataset.inst = state.inst;
  renderTabs(); renderSide();
  if (state.view === "test") renderTest(); else renderPage();
}
if (window.innerWidth <= 860) navClosed = true;
render();
</script>
